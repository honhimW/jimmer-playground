[versions]
slf4j = "2.0.17"
logback = "1.5.38"
jspecify = "1.0.0"
jimmer-bom = "0.11.2"
h2 = "2.4.240"
postgresql = "42.7.13"
mysql = "9.7.0"
mariadb = "3.5.9"
mssql = "13.2.1.jre8"
oracle = "23.26.2.0.0"
sqlite = "3.53.2.0"
central-publish = "0.34.0"
hikari = "7.1.0"
junit-bom = "5.13.4"
testcontainers = "2.0.5"
jackson2 = "2.22.1"

[libraries.slf4j-api]
module = "org.slf4j:slf4j-api"
version.ref = "slf4j"

[libraries.logback-classic]
module = "ch.qos.logback:logback-classic"
version.ref = "logback"

[libraries.jspecify]
module = "org.jspecify:jspecify"
version.ref = "jspecify"

[libraries.jimmer-bom]
module = "org.babyfish.jimmer:jimmer-bom"
version.ref = "jimmer-bom"

[libraries.jackson2]
module = "com.fasterxml.jackson:jackson-bom"
version.ref = "jackson2"

[libraries.h2]
module = "com.h2database:h2"
version.ref = "h2"

[libraries.postgresql]
module = "org.postgresql:postgresql"
version.ref = "postgresql"

[libraries.mysql]
module = "com.mysql:mysql-connector-j"
version.ref = "mysql"

[libraries.mariadb]
module = "org.mariadb.jdbc:mariadb-java-client"
version.ref = "mariadb"

[libraries.mssql]
module = "com.microsoft.sqlserver:mssql-jdbc"
version.ref = "mssql"

[libraries.oracle]
module = "com.oracle.database.jdbc:ojdbc8"
version.ref = "oracle"

[libraries.sqlite]
module = "org.xerial:sqlite-jdbc"
version.ref = "sqlite"

[libraries.hikari]
module = "com.zaxxer:HikariCP"
version.ref = "hikari"

[libraries.junit-bom]
module = "org.junit:junit-bom"
version.ref = "junit-bom"

[libraries.testcontainers]
module = "org.testcontainers:testcontainers-bom"
version.ref = "testcontainers"

[plugins.publish]
id = "com.vanniktech.maven.publish"
version.ref = "central-publish"
